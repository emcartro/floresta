services:
  inventario-hogar:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventario-hogar-pwa:latest
    container_name: inventario_hogar_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/data/uploads
      - DB_PATH=/app/data/inventario.sqlite
    volumes:
      - inventario_storage:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  inventario_storage:
    name: inventario_hogar_data
    driver: local
